name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Soroban SDK 25 requires the wasm32v1-none target (Rust 1.84+).
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Build contracts
        working-directory: contracts
        run: cargo build --target wasm32v1-none --release
      - name: Run contract tests
        working-directory: contracts
        run: cargo test
      - name: Check WASM size
        working-directory: contracts
        run: |
          WASM_SIZE=$(stat -c%s target/wasm32v1-none/release/factbridge.wasm 2>/dev/null || echo 0)
          BUDGET=98304  # 96 KiB
          echo "WASM size: $WASM_SIZE bytes (budget: $BUDGET)"
          if [ "$WASM_SIZE" -gt "$BUDGET" ]; then
            echo "ERROR: WASM exceeds size budget"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/factbridge_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key
      STELLAR_NETWORK: testnet
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run type-check
      - run: npm run build
